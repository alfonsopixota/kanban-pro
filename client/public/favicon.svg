<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="white" filter="url(#shadow)" />
  
  <!-- Kanban Columns Symbol -->
  <rect x="120" y="160" width="60" height="200" rx="30" fill="url(#grad1)" />
  <rect x="226" y="120" width="60" height="280" rx="30" fill="url(#grad1)" opacity="0.8" />
  <rect x="332" y="200" width="60" height="160" rx="30" fill="url(#grad1)" opacity="0.6" />
  
  <!-- "Pro" Dot/Indicator -->
  <circle cx="362" cy="150" r="25" fill="#f43f5e" />
</svg>
